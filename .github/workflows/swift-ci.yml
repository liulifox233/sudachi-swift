name: Swift Bindings CI

on:
  push:
    branches: [ swift ]
    paths:
      - "swift/**"
      - "sudachi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/swift-ci.yml"
  pull_request:
    branches: [ swift ]
    paths:
      - "swift/**"
      - "sudachi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/swift-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  swift-package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-swift-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-swift-cargo-

      - name: Install cargo-swift
        run: |
          if command -v cargo-swift >/dev/null 2>&1; then
            cargo-swift --version
          else
            cargo install cargo-swift@0.11.0 --locked
          fi

      - name: Add Apple targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

          

      - name: Build Swift package
        working-directory: ./swift
        run: cargo swift package --platforms ios macos --name SudachiSwift --accept-all

      - name: Upload Swift package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudachiSwift-package
          path: swift/SudachiSwift
          if-no-files-found: error
