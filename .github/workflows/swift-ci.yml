name: Swift Bindings CI

on:
  push:
    branches: [ swift ]
    paths:
      - "Package.swift"
      - "swift/**"
      - "sudachi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitignore"
      - ".github/workflows/swift-ci.yml"
  pull_request:
    branches: [ swift ]
    paths:
      - "Package.swift"
      - "swift/**"
      - "sudachi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitignore"
      - ".github/workflows/swift-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  swift-package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-swift-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-swift-cargo-

      - name: Install cargo-swift
        run: |
          if command -v cargo-swift >/dev/null 2>&1; then
            cargo swift --version
          else
            cargo install cargo-swift@0.11.0 --locked
            cargo swift --version
          fi

      - name: Add Apple targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

          

      - name: Build Swift package
        working-directory: ./swift
        run: cargo swift package --platforms ios macos --name SudachiSwift --accept-all

      - name: Check committed Swift wrapper source
        run: git diff --no-index --exit-code -- swift/generated/sources/sudachi_swift.swift swift/SudachiSwift/Sources/SudachiSwift/sudachi_swift.swift

      - name: Check root Package.swift renderer
        shell: bash
        run: |
          checksum=$(sed -n 's/^let remoteBinaryArtifactChecksum = "\(.*\)"$/\1/p' Package.swift | head -n 1)
          tag=$(sed -n 's/^let releaseTag = "\(.*\)"$/\1/p' Package.swift | head -n 1)
          ./swift/scripts/render-root-package.sh --tag "${tag}" --checksum "${checksum}"
          git diff --exit-code -- Package.swift

      - name: Validate root Swift package
        env:
          SUDACHI_SWIFT_LOCAL_BINARY_PATH: swift/SudachiSwift/sudachi_swiftFFI.xcframework
        run: swift build

      - name: Upload Swift package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudachiSwift-package
          path: swift/SudachiSwift
          if-no-files-found: error
