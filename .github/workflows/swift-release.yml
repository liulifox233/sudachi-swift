name: Swift Bindings Release

on:
  push:
    tags:
      - "swift-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to publish (e.g. swift-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-swift-package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-swift-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-swift-cargo-

      - name: Install cargo-swift
        run: |
          if command -v cargo-swift >/dev/null 2>&1; then
            cargo-swift --version
          else
            cargo install cargo-swift@0.11.0 --locked
          fi

      - name: Add Apple targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build Swift package
        working-directory: ./swift
        run: cargo swift package --platforms ios macos --name SudachiSwift --accept-all --release

      - name: Archive Swift package
        run: |
          cd swift
          zip -r SudachiSwift-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}.zip SudachiSwift

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          name: Swift Build ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          files: swift/SudachiSwift-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}.zip
          generate_release_notes: true
